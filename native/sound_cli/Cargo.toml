[package]
name = "sound_cli"
version = "0.0.1"
edition = "2021"
description = "Native audio playback for the `sound` Dart/Flutter package."
license = "MIT"
repository = "https://github.com/ManyMath/sound"

[lib]
# cdylib for FFI from Dart; staticlib for static linking (e.g. iOS) later;
# rlib so in-repo examples/tests can call the API directly.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Pure-Rust WAV decoding — no system dependencies.
hound = "3.5"

[target.'cfg(target_os = "linux")'.dependencies]
# Load libasound.so.2 at runtime so we never need ALSA dev headers/pkg-config
# at build time (honoring the no-system-dependencies constraint).
libloading = "0.8"
