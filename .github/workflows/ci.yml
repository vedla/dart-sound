name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (sound_cli)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/sound_cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/sound_cli
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The crate must also compile for Android (AAudio backend)...
      - run: rustup target add aarch64-linux-android
      - run: cargo check --target aarch64-linux-android
      # ...and for Windows, where it currently falls back to a stub backend.
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo check --target x86_64-pc-windows-gnu

  analyze-test:
    name: Analyze & test (Dart/Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The pub workspace includes Flutter packages, so resolve with Flutter.
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output none --set-exit-if-changed packages/sound packages/sound_flutter/lib packages/sound_flutter/example/lib
      - run: dart analyze packages/sound
      - run: flutter analyze packages/sound_flutter
      # FFI playback tests self-skip when the native lib isn't built (no audio
      # device on CI); the API/registry unit tests always run.
      - run: dart test packages/sound
      # Verify the WebAudio backend compiles to JavaScript.
      - run: dart compile js packages/sound/example/web_main.dart -o /tmp/sound_web.js

  build:
    name: Build example (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux, apk]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/sound_cli
      - name: Install Linux desktop build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - run: flutter pub get
      - name: Build ${{ matrix.target }}
        working-directory: packages/sound_flutter/example
        run: flutter build ${{ matrix.target }} --debug
