name: sound

packages:
  - packages/**

# The vendored cargokit build tooling ships its own Dart packages/examples;
# they are not part of this monorepo's workspace.
ignore:
  - "packages/*/cargokit/**"

scripts:
  analyze:
    description: Analyze all packages.
    run: dart analyze --fatal-infos
    exec:
      concurrency: 1

  test:
    description: Run Dart tests in all packages that have them.
    run: dart test
    exec:
      concurrency: 1
    packageFilters:
      dirExists: test
